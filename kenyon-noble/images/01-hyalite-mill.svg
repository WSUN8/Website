<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9a4"/><stop offset="1" stop-color="#e7b77a"/>
    </linearGradient>
    <linearGradient id="creek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa9a4"/><stop offset="1" stop-color="#5f7d78"/>
    </linearGradient>
    <symbol id="pine" viewBox="0 0 40 100">
      <rect x="18" y="80" width="4" height="20" fill="#3b2a1c"/>
      <path d="M20 0 L36 40 H28 L40 70 H30 L40 88 H0 L10 70 H0 L12 40 H4 Z" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1220" cy="230" r="90" fill="#fbe9c4" opacity=".9"/>
  <!-- far peaks -->
  <path d="M0 520 L180 330 L300 420 L470 240 L640 430 L760 360 L900 470 L1080 280 L1240 420 L1380 330 L1600 480 V900 H0Z" fill="#b59a7c"/>
  <path d="M470 240 L520 300 L500 295 L470 320 L445 290 L430 300Z M1080 280 L1130 340 L1100 335 L1080 350 L1060 330 L1040 335Z" fill="#f6ead2"/>
  <!-- canyon walls -->
  <path d="M0 620 L240 470 L420 560 L620 500 L700 600 L560 900 H0Z" fill="#7a6248"/>
  <path d="M1600 600 L1360 470 L1160 560 L980 520 L900 610 L1040 900 H1600Z" fill="#6d563f"/>
  <!-- creek -->
  <path d="M700 600 Q780 640 760 720 T820 900 H1040 Q960 800 960 720 T900 610Z" fill="url(#creek)"/>
  <path d="M780 680 q30 10 60 0 M800 760 q40 10 80 0 M830 840 q40 10 90 0" stroke="#d5e3df" stroke-width="4" fill="none" opacity=".7"/>
  <!-- trees -->
  <g color="#3f4d33">
    <use href="#pine" x="40" y="470" width="70" height="170"/>
    <use href="#pine" x="120" y="500" width="60" height="150"/>
    <use href="#pine" x="300" y="520" width="55" height="140"/>
    <use href="#pine" x="1380" y="480" width="70" height="170"/>
    <use href="#pine" x="1470" y="520" width="60" height="150"/>
    <use href="#pine" x="1200" y="530" width="50" height="130"/>
  </g>
  <!-- sawmill -->
  <g transform="translate(1000 560)">
    <rect x="0" y="40" width="300" height="150" fill="#8a5a33"/>
    <path d="M-20 45 L150 -30 L320 45Z" fill="#5a3a22"/>
    <g stroke="#6b4426" stroke-width="3">
      <path d="M20 40 V190 M50 40 V190 M80 40 V190 M110 40 V190 M140 40 V190 M170 40 V190 M200 40 V190 M230 40 V190 M260 40 V190 M290 40 V190"/>
    </g>
    <rect x="120" y="110" width="60" height="80" fill="#3b2a1c"/>
    <rect x="30" y="80" width="50" height="35" fill="#e9c98e"/>
    <rect x="220" y="80" width="50" height="35" fill="#e9c98e"/>
    <!-- waterwheel -->
    <g transform="translate(-40 150)">
      <circle r="70" fill="none" stroke="#4a3220" stroke-width="10"/>
      <circle r="10" fill="#4a3220"/>
      <path d="M-70 0 H70 M0 -70 V70 M-50 -50 L50 50 M50 -50 L-50 50" stroke="#4a3220" stroke-width="6"/>
    </g>
  </g>
  <!-- log pile -->
  <g fill="#9b6a3f" stroke="#5a3a22" stroke-width="4">
    <rect x="1320" y="720" width="220" height="30" rx="15"/>
    <rect x="1340" y="690" width="190" height="30" rx="15"/>
    <rect x="1360" y="660" width="150" height="30" rx="15"/>
  </g>
  <rect width="1600" height="900" fill="#3b2a1c" opacity=".08"/>
</svg>
