<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc0c9"/><stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 470 L180 380 L360 440 L560 330 L760 430 L980 350 L1200 440 L1420 360 L1600 420 V900 H0Z" fill="#7e9285"/>
  <path d="M0 560 Q400 520 800 560 T1600 560 V900 H0Z" fill="#6f8a5c"/>
  <!-- road -->
  <path d="M640 900 L760 560 H840 L960 900Z" fill="#7a7062"/>
  <path d="M800 580 V620 M800 660 V720 M800 770 V850" stroke="#efe2b8" stroke-width="8"/>
  <!-- welcome sign -->
  <g transform="translate(140 430)">
    <rect x="40" y="120" width="18" height="200" fill="#5a3a22"/>
    <rect x="342" y="120" width="18" height="200" fill="#5a3a22"/>
    <rect x="0" y="0" width="400" height="150" rx="8" fill="#f2e6c8" stroke="#5a3a22" stroke-width="8"/>
    <text x="200" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="4" fill="#3b2a1c">WELCOME HOME</text>
    <text x="200" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1f3a2c">BOZEMAN</text>
  </g>
  <!-- 1940s pickup -->
  <g transform="translate(980 600)">
    <path d="M0 100 Q0 40 60 40 H200 L250 0 H360 Q400 0 410 40 L420 100 H560 V170 H0Z" fill="#2f5a46"/>
    <path d="M265 15 H350 Q380 15 385 50 H240Z" fill="#c9dbe0"/>
    <rect x="430" y="70" width="130" height="30" fill="#264a3a"/>
    <rect x="-10" y="130" width="40" height="18" fill="#c9c2b0"/>
    <circle cx="20" cy="100" r="14" fill="#f4e7b0"/>
    <circle cx="110" cy="175" r="48" fill="#1a1a1a"/><circle cx="110" cy="175" r="20" fill="#bdb6a6"/>
    <circle cx="460" cy="175" r="48" fill="#1a1a1a"/><circle cx="460" cy="175" r="20" fill="#bdb6a6"/>
  </g>
  <!-- keys -->
  <g transform="translate(640 160) rotate(-20)" fill="none" stroke="#c9a24f" stroke-width="12">
    <circle r="40"/>
    <path d="M40 0 H190 M150 0 V30 M175 0 V24" stroke-linecap="round"/>
  </g>
