<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86b7c6"/><stop offset="1" stop-color="#d9ecec"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 420 L220 330 L420 380 L640 280 L860 380 L1080 300 L1300 370 L1600 310 V900 H0Z" fill="#9db0ad"/>
  <!-- mid-century building -->
  <g transform="translate(180 300)">
    <rect width="1240" height="340" fill="#e9e1cf"/>
    <path d="M-60 0 L1300 -40 V20 L-60 50Z" fill="#c2552f"/>
    <rect x="0" y="120" width="1240" height="220" fill="#d3c7ad"/>
    <!-- glass storefront -->
    <g fill="#40626b">
      <rect x="40" y="150" width="200" height="190"/><rect x="250" y="150" width="200" height="190"/>
      <rect x="790" y="150" width="200" height="190"/><rect x="1000" y="150" width="200" height="190"/>
    </g>
    <g fill="#9fc3ca" opacity=".5">
      <path d="M60 160 L120 160 L60 240Z M270 160 L330 160 L270 240Z M810 160 L870 160 L810 240Z M1020 160 L1080 160 L1020 240Z"/>
    </g>
    <rect x="520" y="170" width="200" height="170" fill="#2b3e43"/>
    <path d="M620 170 V340" stroke="#d3c7ad" stroke-width="6"/>
    <!-- stone accent -->
    <rect x="460" y="120" width="40" height="220" fill="#a89a82"/>
    <rect x="740" y="120" width="40" height="220" fill="#a89a82"/>
    <!-- sign -->
    <text x="620" y="95" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="66" font-weight="700" font-style="italic" fill="#1f3a2c">Kenyon Noble</text>
  </g>
  <!-- pylon sign -->
  <g transform="translate(90 200)">
    <rect x="30" y="40" width="20" height="400" fill="#4a4a4a"/>
    <path d="M0 0 H80 L100 140 H-20Z" fill="#c2552f"/>
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#f6efe0">KN</text>
  </g>
  <rect y="640" width="1600" height="260" fill="#8e8a82"/>
  <rect y="640" width="1600" height="24" fill="#bdb7ab"/>
  <!-- 50s car -->
  <g transform="translate(980 700)">
    <path d="M0 90 Q10 40 90 40 L150 0 H320 L380 40 H480 Q520 45 520 90 V120 H0Z" fill="#d97a5a"/>
    <path d="M165 12 H310 L355 40 H130Z" fill="#cfe4e6"/>
    <path d="M0 80 H520" stroke="#f3ece0" stroke-width="6"/>
    <circle cx="110" cy="125" r="38" fill="#1a1a1a"/><circle cx="110" cy="125" r="18" fill="#f3ece0"/>
    <circle cx="420" cy="125" r="38" fill="#1a1a1a"/><circle cx="420" cy="125" r="18" fill="#f3ece0"/>
  </g>
</svg>
